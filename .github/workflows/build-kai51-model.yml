name: Build HAxBRO AI Model

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Approved upstream model
        required: true
        default: HuggingFaceTB/SmolLM2-360M-Instruct
  push:
    paths:
      - .github/workflows/build-kai51-model.yml
      - scripts/prepare-kai51.mjs
      - kai51/engine/**
      - model-build-trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "optimum[onnxruntime]" transformers huggingface_hub
      - name: Export and quantize
        env:
          MODEL_ID: ${{ inputs.model_id || 'HuggingFaceTB/SmolLM2-360M-Instruct' }}
        run: |
          rm -rf build
          python scripts/prepare-kai51.mjs
      - name: Assemble release payload
        run: |
          rm -rf build/kai51-release
          mkdir -p build/kai51-release
          find build/kai51 -type f -not -path '*/quantized/*' -exec cp {} build/kai51-release/ \;
          find build/kai51/quantized -type f -exec cp {} build/kai51-release/ \;
          printf '%s\n' '{"name":"HAxBRO AI Model","runtime":"Transformers.js / ONNX Runtime Web","source_model":"HuggingFaceTB/SmolLM2-360M-Instruct","source_license":"Apache-2.0","format":"ONNX optimized + quantized","architecture":"single-core-orchestrator","primary_device":"WebGPU","fallback_device":"WASM","release_tag":"kai51-model-latest"}' > build/kai51-release/MODEL-MANIFEST.json
      - name: Replace stable model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kai51-model-latest --yes || true
          git push origin :refs/tags/kai51-model-latest || true
          gh release create kai51-model-latest build/kai51-release/* --title "HAxBRO AI Model - Stable" --notes "HAxBRO AI runtime artifact. Source: HuggingFaceTB/SmolLM2-360M-Instruct (Apache-2.0)."
