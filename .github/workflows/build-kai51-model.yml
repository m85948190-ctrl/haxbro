name: Build HAxBRO AI Model

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-kai51-model.yml
      - model-build-trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model packaging toolchain
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
      - name: Mirror verified browser-ready model
        run: |
          rm -rf build/kai51-source build/kai51-release
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "onnx-community/SmolLM2-360M-Instruct-ONNX",
              local_dir="build/kai51-source",
              allow_patterns=[
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "generation_config.json",
                  "chat_template.jinja",
                  "onnx/model_q4.onnx",
                  "onnx/model_q4f16.onnx"
              ]
          )
          PY
      - name: Assemble stable release
        run: |
          mkdir -p build/kai51-release
          cp build/kai51-source/config.json build/kai51-release/
          cp build/kai51-source/tokenizer.json build/kai51-release/ 2>/dev/null || true
          cp build/kai51-source/tokenizer_config.json build/kai51-release/ 2>/dev/null || true
          cp build/kai51-source/special_tokens_map.json build/kai51-release/ 2>/dev/null || true
          cp build/kai51-source/generation_config.json build/kai51-release/ 2>/dev/null || true
          cp build/kai51-source/chat_template.jinja build/kai51-release/ 2>/dev/null || true
          cp build/kai51-source/onnx/model_q4.onnx build/kai51-release/model_q4.onnx
          cp build/kai51-source/onnx/model_q4f16.onnx build/kai51-release/model_q4f16.onnx
          printf '%s\n' '{"name":"HAxBRO AI Model","runtime":"Transformers.js / ONNX Runtime Web","source_model":"HuggingFaceTB/SmolLM2-360M-Instruct","source_onnx":"onnx-community/SmolLM2-360M-Instruct-ONNX","source_license":"Apache-2.0","format":"browser-ready ONNX q4 + q4f16","architecture":"single-core-orchestrator","primary_device":"WebGPU","fallback_device":"WASM","release_tag":"kai51-model-latest"}' > build/kai51-release/MODEL-MANIFEST.json
      - name: Verify release payload
        run: |
          test -s build/kai51-release/config.json
          test -s build/kai51-release/model_q4.onnx
          test -s build/kai51-release/model_q4f16.onnx
      - name: Replace stable GitHub model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kai51-model-latest --yes || true
          git push origin :refs/tags/kai51-model-latest || true
          gh release create kai51-model-latest build/kai51-release/*             --title "HAxBRO AI Model - Stable"             --notes "HAxBRO browser-ready model package. Upstream source: HuggingFaceTB/SmolLM2-360M-Instruct. Browser ONNX conversion source: onnx-community/SmolLM2-360M-Instruct-ONNX. Apache-2.0."
