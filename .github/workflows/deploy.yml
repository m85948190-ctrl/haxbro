name: Deploy HAxBRO API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo "=== Looking for backend folder ==="
          ls -la backend/ || echo "backend folder not found"

      - name: Auto-create backend folder if missing
        run: |
          if [ ! -d "backend" ]; then
            echo "📁 Creating backend folder..."
            mkdir -p backend
            echo "✅ backend folder created"
          else
            echo "✅ backend folder already exists"
          fi
          ls -la

      - name: Auto-create server.py if missing
        run: |
          if [ ! -f "backend/server.py" ]; then
            echo "📄 Creating server.py..."
            cat > backend/server.py << 'EOF'
from fastapi import FastAPI
from pydantic import BaseModel
import uvicorn

app = FastAPI()

class ChatRequest(BaseModel):
    prompt: str
    mode: str = "normal"

@app.get("/")
async def root():
    return {"status": "HAxBRO is running"}

@app.post("/api/chat")
async def chat(request: ChatRequest):
    return {"response": f"You asked: {request.prompt}", "mode": request.mode}

if __name__ == "__main__":
    uvicorn.run(app, host="0.0.0.0", port=8000)
EOF
            echo "✅ server.py created"
          else
            echo "✅ server.py already exists"
          fi

      - name: Auto-create requirements.txt if missing
        run: |
          if [ ! -f "backend/requirements.txt" ]; then
            echo "📄 Creating requirements.txt..."
            cat > backend/requirements.txt << 'EOF'
fastapi==0.115.6
uvicorn==0.34.0
pydantic==2.10.4
requests==2.32.3
EOF
            echo "✅ requirements.txt created"
          else
            echo "✅ requirements.txt already exists"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Test server (background)
        run: |
          python backend/server.py &
          sleep 3
          echo "=== Testing server ==="
          curl http://localhost:8000/ || echo "Server not responding"

      - name: Deploy to Render (if secret exists)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Deploying to Render..."
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Deploy triggered!"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK not set. Skipping deploy."
          fi
