name: KAI 360M training pipeline checks

on:
  push:
    branches: [main, kai360m-conversation-training]
    paths:
      - "training/kai360m/**"
      - ".github/workflows/kai360m-training-check.yml"
  pull_request:
    paths:
      - "training/kai360m/**"
      - ".github/workflows/kai360m-training-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training scripts
        run: python -m py_compile training/kai360m/train_sft.py training/kai360m/evaluate.py training/kai360m/merge_adapter.py training/kai360m/validate_dataset.py
      - name: Validate training and held-out datasets
        working-directory: training/kai360m
        run: python validate_dataset.py
