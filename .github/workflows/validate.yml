name: KAI 51 first-party validation
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check kai51/first-party-core.js
      - run: node --check kai51/capabilities.js
      - run: node --check kai51/decoder.js
      - run: node --check kai51/app-maker.js
      - run: node --check kai51/qwen-chat.js
      - run: test -f index.html
      - run: grep -q 'Qwen3-0.6B' index.html
      - run: grep -q 'onnx-community/Qwen3-0.6B-ONNX' kai51/qwen-chat.js
      - run: grep -q 'api/kai/search' kai51/qwen-chat.js
      - run: grep -q 'training/finetune_qwen3_code.py' README.md
      - name: Syntax-check browser entry module
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const m=html.match(/<script type="module">([\s\S]*?)<\/script>/); if(!m) throw new Error("Inline module entry missing"); fs.writeFileSync("/tmp/haxbro-index-script.mjs",m[1]);'
          node --check /tmp/haxbro-index-script.mjs
      - name: Verify no obsolete Gemma UI references
        run: |
          ! grep -q 'Gemma 3 1B' index.html
          ! grep -q 'gemma-webgpu' index.html
